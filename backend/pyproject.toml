[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripwise-api"
version = "0.1.0"
description = "TripWise travel planning and expense API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "redis>=5.2,<6",
  "rq>=2.1,<3",
  "openai>=1.59,<2",
  "PyJWT[crypto]>=2.10,<3",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "httpx2>=2,<3",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
